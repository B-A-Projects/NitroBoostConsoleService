apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nitroboost-ingress
  labels:
    app: nitroboost
spec:
  rules:
    - host: nitroboost.io
      http:
        paths:
          - path: /api/console
            pathType: Prefix
            backend:
              service:
                name: console-service
                port:
                  number: 8080